name: "Hub target data validation"
description: >-
  Validate the target data files in a hub pull request with
  hubValidations::validate_target_pr(), and write the result up for a pull
  request comment.
author: "hubverse"

inputs:
  # validate_target_pr() passthrough
  hub_path:
    description: "Path to the hub, relative to the checkout root."
    default: "."
  gh_repo:
    description: "Hub repository as owner/name. Defaults to the workflow repository."
    default: ${{ github.repository }}
  pr_number:
    description: "Pull request number to validate. Defaults to the triggering pull request."
    default: ${{ github.event.number }}
  output_type_id_datatype:
    description: >-
      Data type to coerce the output_type_id column to: from_config, auto,
      character, double, integer, logical or Date.
    default: "from_config"
  date_col:
    description: >-
      Name of the column holding the date an observation occurred, when that
      column is not a task ID. Ignored when the hub has a target-data.json
      config. Empty for none.
    default: ""
  allow_extra_dates:
    description: >-
      Allow time-series date values that are not in tasks.json (true/false).
      Oracle output is always checked strictly.
    default: "false"
  round_id:
    description: >-
      Round ID naming the block of custom validation checks to run. The default
      runs the default block.
    default: "default"
  validations_cfg_path:
    description: "Path to a custom validations config file. Empty uses the hub default."
    default: ""
  file_modification_check:
    description: >-
      How to treat modification/deletion of previously submitted target data
      files: none, message, failure or error.
    default: "none"
  allow_target_type_deletion:
    description: >-
      Allow a pull request to delete every file of a target type (true/false).
    default: "false"
  # check_for_errors() passthrough
  verbose:
    description: "Print the result of every check before the summary (true/false)."
    default: "true"
  show_warnings:
    description: "Print check-level warnings inline with their checks (true/false)."
    default: "false"
  # commenting
  comment:
    description: >-
      Post the result as a pull request comment (true/false). Turn it off to
      keep the result to the job summary and the workflow log.
    default: "true"
  comment_header:
    description: >-
      Key identifying the comment, so that re-running a commit edits it in place
      rather than adding another. A repository validating more than one hub
      needs a distinct key for each, or they overwrite each other's comment.
    default: "target-data-validation"
  # environment / setup
  extra_packages:
    description: >-
      Additional R packages to install, using setup-r-dependencies `extra-packages`
      syntax (one per line). Use for custom validation checks that need extra deps.
    default: ""
  extra_repositories:
    description: "Extra R package repositories passed to setup-r."
    default: "https://hubverse-org.r-universe.dev"
  github_token:
    description: "Token used to read pull request files via the GitHub API and to comment."
    default: ${{ github.token }}

outputs:
  summary-path:
    description: "Path the markdown summary was written to."
    value: ${{ steps.paths.outputs.summary }}

runs:
  using: composite
  steps:
    # One place decides where the summary lives, so nothing downstream has to
    # agree with a path spelled out in a caller's workflow.
    - id: paths
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/validate-target-data"
        mkdir -p "$dir"
        # Delete any summary left by an earlier run in the same job, which
        # would otherwise be published as this run's result.
        rm -f "$dir/summary.md"
        echo "summary=$dir/summary.md" >> "$GITHUB_OUTPUT"

    - uses: r-lib/actions/setup-r@v2
      with:
        use-public-rspm: true
        extra-repositories: ${{ inputs.extra_repositories }}

    - uses: r-lib/actions/setup-r-dependencies@v2
      env:
        GITHUB_PAT: ${{ inputs.github_token }}
      with:
        # Cache the installed packages even when validation fails.
        cache: 'always'
        packages: |
          any::hubValidations
          any::sessioninfo
        extra-packages: ${{ inputs.extra_packages }}

    - name: Run target data validations
      shell: bash
      env:
        GITHUB_PAT: ${{ inputs.github_token }}
        HUB_PATH: ${{ inputs.hub_path }}
        GH_REPO: ${{ inputs.gh_repo }}
        PR_NUMBER: ${{ inputs.pr_number }}
        OUTPUT_TYPE_ID_DATATYPE: ${{ inputs.output_type_id_datatype }}
        DATE_COL: ${{ inputs.date_col }}
        ALLOW_EXTRA_DATES: ${{ inputs.allow_extra_dates }}
        ROUND_ID: ${{ inputs.round_id }}
        VALIDATIONS_CFG_PATH: ${{ inputs.validations_cfg_path }}
        FILE_MODIFICATION_CHECK: ${{ inputs.file_modification_check }}
        ALLOW_TARGET_TYPE_DELETION: ${{ inputs.allow_target_type_deletion }}
        VERBOSE: ${{ inputs.verbose }}
        SHOW_WARNINGS: ${{ inputs.show_warnings }}
        SUMMARY_PATH: ${{ steps.paths.outputs.summary }}
      run: Rscript "${GITHUB_ACTION_PATH}/validate.R"

    - name: Write the result to the job summary
      if: ${{ !cancelled() }}
      shell: bash
      env:
        SUMMARY: ${{ steps.paths.outputs.summary }}
      run: |
        if [ ! -s "$SUMMARY" ]; then
          cat > "$SUMMARY" <<'EOF'
        ## Target data validation

        :x: **Validation did not complete.** The workflow failed before it could check this pull request's target data, which usually points at the hub's CI rather than the data itself. The workflow log has the detail.
        EOF
        fi
        cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

    # Comment only on a pull request from the hub itself, since a fork's token
    # is read-only.
    - name: Post the result on the pull request
      if: >-
        !cancelled() && inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      uses: hubverse-org/hubverse-actions/pr-comment@main
      with:
        pr: ${{ github.event.number }}
        header: ${{ inputs.comment_header }}
        # Keying on the submitted commit posts a fresh comment per revision,
        # which notifies, and keeps earlier results on the thread.
        revision: ${{ github.event.pull_request.head.sha }}
        body_path: ${{ steps.paths.outputs.summary }}
        token: ${{ inputs.github_token }}

    - name: Report why a fork pull request is not commented on
      if: >-
        !cancelled() && inputs.comment == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository
      shell: bash
      run: >-
        echo "::notice::This pull request comes from a fork, whose read-only
        token cannot post a comment. The result is in this run's job summary."
