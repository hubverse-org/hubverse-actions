version: 2
updates:
  - package-ecosystem: github-actions
    # "/" covers the test workflows in .github/workflows. "/*" covers each
    # top-level template directory, where Dependabot reads every YAML file
    # as a workflow or composite action.
    directories:
      - "/"
      - "/*"
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependabot"
