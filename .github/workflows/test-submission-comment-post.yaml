name: Test submission comment flow (post)

# Stage 2 of the self-test, and the same shape a hub uses: a separate workflow
# listening for the first one finishing, calling the shared workflow that hubs
# call. So this exercises the real posting path rather than a copy of it.
#
# It only starts working once on the default branch, since `workflow_run` fires
# only for workflow files already there. The `verify` job asserts the comment
# landed on the right pull request, and the `cleanup` job removes it.

on:
  workflow_run:
    workflows: ["Test submission comment flow"]
    types: [completed]

permissions:
  contents: read

env:
  MARKER: "<!-- hubverse-comment:ci-comment-flow-${{ github.run_id }}:${{ github.event.workflow_run.head_sha }} -->"

jobs:
  comment:
    uses: ./.github/workflows/post-validation-comment.yaml
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      artifact_name: comment-flow-selftest
      # The header carries the run ID so that two runs for the same commit
      # never share a comment. Change it together with MARKER above.
      header: ci-comment-flow-${{ github.run_id }}

  verify:
    # Only assert a comment exists when stage 1 actually uploaded one. If it
    # failed before the upload, the comment job correctly posts nothing and its
    # own red run is the signal — asserting here would just double-report it.
    if: github.event.workflow_run.conclusion == 'success'
    needs: comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - id: pr
        uses: ./resolve-pr

      - name: Assert it landed on the right pull request
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number,
              per_page: 100,
            });
            const mine = comments.filter((c) => c.body && c.body.includes(process.env.MARKER));
            if (mine.length !== 1) {
              core.setFailed(`expected exactly 1 comment on PR ${issue_number}, found ${mine.length}`);
              return;
            }
            if (!mine[0].body.includes('comment-flow self-test')) {
              core.setFailed('the posted comment does not carry the stub summary');
              return;
            }
            core.info(`comment flow self-test passed on PR ${issue_number}.`);

  cleanup:
    # Each run posts under its own header, so no later run removes a comment
    # this run leaves behind.
    if: always()
    needs: [comment, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - id: pr
        uses: ./resolve-pr

      - name: Remove the test comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });
            for (const comment of comments.filter((c) => c.body && c.body.includes(process.env.MARKER))) {
              // The log is the only record of the comment once it is deleted.
              core.info(`Removing comment ${comment.id}:\n${comment.body}`);
              await github.rest.issues.deleteComment({ ...context.repo, comment_id: comment.id });
            }
