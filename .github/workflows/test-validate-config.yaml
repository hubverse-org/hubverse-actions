name: Test validate-config action

# Exercises the validate-config composite action (referenced locally) against
# hubverse-org/ci-testhub-simple, as it stands and with its tasks.json broken,
# asserting each produces its expected outcome and pull request summary. A
# separate job covers the summary rendering on its own, without a hub.
#
# Both runs pass `comment: false`, so what no job here reaches is the posting
# half. These jobs assert on the file the action writes; posting it is covered
# by the pr-comment self-tests.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'validate-config/**'
      - '!**/README.md'
      - '.github/workflows/test-validate-config.yaml'

permissions:
  contents: read

jobs:
  # The rendering on its own, over the test hub bundled with hubUtils. No hub
  # checkout and no token, so it covers what the fixture hub cannot reach, such
  # as an oversized error table and a run that never got started.
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: 'https://hubverse-org.r-universe.dev'

      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ github.token }}
        with:
          # A failing run is the ordinary case while a test is being fixed, and
          # the default only saves the cache when the workflow succeeds. The
          # composite action sets this for the same reason.
          cache: 'always'
          # Matched to the composite action's list, so that once a branch has run
          # once these jobs share one setup-r-dependencies cache entry rather
          # than building two. The key is the resolved package set.
          packages: |
            any::hubAdmin
            any::sessioninfo

      - name: Run the summary tests
        run: Rscript validate-config/tests/test-summary.R

  action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the action under test
        uses: actions/checkout@v7

      - name: Checkout the fixture hub
        uses: actions/checkout@v7
        with:
          repository: hubverse-org/ci-testhub-simple
          path: testhub

      - name: Validate the fixture hub as it stands
        id: valid
        uses: ./validate-config
        with:
          hub_path: testhub
          # Asserted on below, from the file the action writes. Posting is
          # covered by the pr-comment self-tests.
          comment: false

      - name: Assert a valid config passes and says so
        env:
          # Taken from the action's output, so the test cannot drift from where
          # the action actually writes.
          SUMMARY: ${{ steps.valid.outputs.summary-path }}
        run: |
          cat "$SUMMARY"
          if ! grep -qF ':white_check_mark:' "$SUMMARY"; then
            echo "::error::a valid config should render the success marker"
            exit 1
          fi

      - name: Break the fixture hub's tasks.json
        run: sed -i 's/"rounds"/"roundz"/' testhub/hub-config/tasks.json

      - name: Validate the broken fixture hub
        id: invalid
        continue-on-error: true
        uses: ./validate-config
        with:
          hub_path: testhub
          comment: false

      - name: Assert a broken config fails and renders its error table
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
          SUMMARY: ${{ steps.invalid.outputs.summary-path }}
        run: |
          status=0
          if [ "$OUTCOME" != failure ]; then
            echo "::error::a broken config should fail the step, got: $OUTCOME"
            status=1
          fi
          cat "$SUMMARY"
          if ! grep -qF ':x:' "$SUMMARY"; then
            echo "::error::a broken config should render the failure marker"
            status=1
          fi
          if ! grep -qF '<table>' "$SUMMARY"; then
            echo "::error::the summary carries no error table"
            status=1
          fi
          # The local tests run against whichever gt is installed on a developer's
          # machine; this runs against whichever gt r-universe resolves to today.
          # A gt release that changed the markup would show up here first.
          if grep -qF 'style=' "$SUMMARY"; then
            echo "::error::styling GitHub discards was left in the summary"
            status=1
          fi
          size=$(wc -c < "$SUMMARY")
          if [ "$size" -ge 65536 ]; then
            echo "::error::summary is $size bytes, over GitHub's comment limit"
            status=1
          fi
          echo "summary is $size bytes"
          exit "$status"
